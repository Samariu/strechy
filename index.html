<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Strechy</title>
  <meta name="description" content="Guided stretching and mobility timer.">
  <meta name="theme-color" content="#0e1116">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Strechy">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <div id="flash" aria-hidden="true"></div>
  <dialog id="confirm-exit">
    <form method="dialog">
      <p class="dialog-title">End session?</p>
      <p class="dialog-body">Progress won't be logged.</p>
      <div class="dialog-actions">
        <button value="cancel" class="btn btn-secondary">Keep going</button>
        <button value="end" class="btn btn-danger">End</button>
      </div>
    </form>
  </dialog>
  <noscript><p style="padding:24px">Strechy needs JavaScript enabled.</p></noscript>
</body>
</html>
